<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>INSIK GAME — Minesweeper</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root{--glass-bg:rgba(255,255,255,.08);--glass-border:rgba(255,255,255,.2);--glass-shadow:0 8px 32px rgba(0,0,0,.15);--text:#fff;--accent:#ffd700;--cell-bg:rgba(255,255,255,.15);--cell-hover:rgba(255,255,255,.28);--cell-open:rgba(255,255,255,.06);--cell-border:rgba(255,255,255,.18);--cell-size:38px}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Segoe UI',Inter,system-ui,-apple-system,sans-serif;min-height:100vh;color:var(--text);background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);background-size:cover;background-attachment:fixed;display:flex;flex-direction:column;align-items:center;padding:16px;transition:background .6s ease;overflow-x:hidden;position:relative}
        .glass{background:var(--glass-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);border-radius:16px}
        header{width:100%;max-width:1000px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:14px 20px;gap:12px;z-index:10}
        .logo{font-size:1.8rem;font-weight:800;letter-spacing:2px;background:linear-gradient(135deg,#fff,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 2px 10px rgba(0,0,0,.3);cursor:default;user-select:none}
        .header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
        .balance,.level-info,.profile-btn{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:30px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);font-weight:700;font-size:1rem;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap;cursor:pointer}
        .balance .coin{font-size:1.3rem;filter:drop-shadow(0 0 6px rgba(255,215,0,.8))}.level-info .xp{font-size:.9rem;color:#ffd700}.profile-btn .avatar{font-size:1.5rem}
        .btn{padding:10px 18px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;font-weight:600;font-size:.95rem;cursor:pointer;transition:all .2s ease;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);letter-spacing:.5px;white-space:nowrap}
        .btn:hover{background:rgba(255,255,255,.25);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.2)}.btn:active{transform:translateY(0);box-shadow:none}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
        main{width:100%;max-width:1000px;display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px 0;flex:1}
        .game-info{display:flex;gap:20px;padding:12px 24px;font-weight:700;font-size:1.1rem;align-items:center}.info-item{display:flex;align-items:center;gap:8px}
        .board-wrapper{padding:12px;display:flex;justify-content:center;align-items:center;max-width:95vw;position:relative}.board{display:grid;gap:2px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
        .cell{width:var(--cell-size);height:var(--cell-size);display:flex;align-items:center;justify-content:center;background:var(--cell-bg);border:1px solid var(--cell-border);border-radius:6px;cursor:pointer;font-weight:800;font-size:calc(var(--cell-size)*.5);color:#fff;transition:background .15s ease,transform .1s ease,box-shadow .2s ease;animation:fadeIn .25s ease}
        .cell:hover{background:var(--cell-hover);transform:scale(1.04);box-shadow:0 0 12px rgba(255,255,255,.2)}.cell.revealed{background:var(--cell-open);cursor:default;animation:openPop .25s ease}.cell.revealed:hover{background:var(--cell-open);transform:none;box-shadow:none}.cell.mine{background:rgba(255,60,60,.3)}.cell.exploded{animation:explode .6s ease;background:rgba(255,0,0,.7)}.cell.flagged{background:rgba(255,215,0,.2)}.num-1{color:#4fc3f7}.num-2{color:#81c784}.num-3{color:#ff8a65}.num-4{color:#ba68c8}.num-5{color:#f06292}.num-6{color:#4dd0e1}.num-7{color:#fff176}.num-8{color:#e0e0e0}
        .hint{margin-top:16px;padding:12px 20px;font-size:.95rem;color:#fff;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:12px;text-align:center;max-width:600px}.controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}.modal-overlay.active{display:flex}
        .modal-content{background:rgba(255,255,255,.12);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.3);box-shadow:0 20px 60px rgba(0,0,0,.4);border-radius:20px;padding:24px;width:100%;max-width:520px;max-height:85vh;overflow-y:auto;animation:modalIn .3s ease}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-title{font-size:1.4rem;font-weight:700}.close-btn{background:none;border:none;color:#fff;font-size:1.8rem;cursor:pointer;line-height:1;padding:0 4px;transition:transform .2s}.close-btn:hover{transform:rotate(90deg)}
        .instruction-text{line-height:1.7;font-size:1rem}.difficulty-options{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.difficulty-btn{padding:12px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-weight:700;font-size:1.2rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px}.difficulty-btn.selected{background:rgba(255,215,0,.4);border-color:#ffd700;box-shadow:0 0 16px rgba(255,215,0,.4)}
        .size-form{display:flex;flex-direction:column;gap:14px}.size-inputs{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.size-inputs label{display:flex;align-items:center;gap:6px;font-weight:600}.size-inputs input{width:70px;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15);color:#fff;font-size:1rem;text-align:center;outline:none}.size-inputs input:focus{border-color:#ffd700;box-shadow:0 0 10px rgba(255,215,0,.3)}input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}input[type=number]{-moz-appearance:textfield}.error-msg{color:#ff8a80;font-weight:600;min-height:24px}
        .shop-tabs{display:flex;gap:6px;margin-bottom:16px}.shop-tab{padding:10px 18px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;cursor:pointer;font-weight:600;transition:all .2s}.shop-tab.active{background:rgba(255,215,0,.35);border-color:#ffd700}.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.shop-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px;transition:all .25s}.shop-card:hover{background:rgba(255,255,255,.15);transform:translateY(-4px);box-shadow:0 10px 24px rgba(0,0,0,.2)}.shop-preview{width:60px;height:60px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:2rem;border:1px solid rgba(255,255,255,.3)}.shop-name{font-weight:700;font-size:.95rem;text-align:center}.shop-price{font-size:.9rem;font-weight:600;color:#ffe082}.shop-btn{width:100%;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.15);color:#fff;font-weight:700;cursor:pointer;transition:all .2s}.shop-btn:hover{background:rgba(255,255,255,.3)}.shop-btn.unavailable{background:rgba(128,128,128,.3);color:#aaa;cursor:not-allowed}
        .qty-selector{display:flex;align-items:center;gap:8px}.qty-btn{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none;transition:all .2s}.qty-btn:hover{background:rgba(255,255,255,.4)}.qty-input{width:40px;text-align:center;background:transparent;border:none;color:#fff;font-weight:700;font-size:1rem;outline:none}
        .booster-icon{padding:5px 10px;border-radius:8px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:4px;border:1px solid transparent}.booster-icon.active{background:rgba(0,255,0,.3);border-color:#0f0;box-shadow:0 0 10px rgba(0,255,0,.5)}.booster-count{font-size:.9rem}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);padding:14px 24px;border-radius:12px;background:rgba(0,0,0,.8);color:#fff;font-weight:700;z-index:2000;transition:transform .3s ease,opacity .3s ease;opacity:0;pointer-events:none;text-align:center;max-width:90vw}.toast.show{transform:translateX(-50%) translateY(0);opacity:1}.toast.success{background:rgba(46,125,50,.9)}.toast.error{background:rgba(198,40,40,.9)}
        @keyframes fadeIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}@keyframes openPop{0%{transform:scale(.7);opacity:.4}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}@keyframes explode{0%{transform:scale(1)}30%{transform:scale(1.4);background:rgba(255,0,0,.8)}60%{transform:scale(.8);background:rgba(255,100,0,.6)}100%{transform:scale(1);background:rgba(255,0,0,.7)}}@keyframes modalIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
        .cheat-btn{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#000;font-weight:800;border:1px solid #ffd700;box-shadow:0 0 12px rgba(255,215,0,.6)}.cheat-btn:hover{background:linear-gradient(135deg,#ffed4a,#ffa500);box-shadow:0 0 20px rgba(255,215,0,.8)}.cheat-options{display:flex;flex-direction:column;gap:12px}.cheat-action{font-size:1.1rem;padding:14px;text-align:center;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);border-radius:12px;cursor:pointer;transition:all .2s;color:#fff;font-weight:700}.cheat-action:hover{background:rgba(255,255,255,.35);transform:scale(1.02)}.cheat-action:active{transform:scale(.98)}.cell.show-mine{background:rgba(255,0,0,.4)!important;box-shadow:inset 0 0 10px rgba(255,0,0,.8);border-color:rgba(255,0,0,.8)}
        .boom-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:3000;display:flex;align-items:center;justify-content:center;animation:boomFlash .8s ease}.boom-report{position:relative;width:320px;height:320px;border-radius:50%;background:rgba(255,255,255,.95);color:#333;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;box-shadow:0 0 50px rgba(255,0,0,.5);animation:reportIn 1s ease}.boom-ring{position:absolute;top:0;left:0;pointer-events:none}.boom-ring circle{stroke-dasharray:880;stroke-dashoffset:0;animation:ringCountdown 15s linear forwards}@keyframes ringCountdown{from{stroke-dashoffset:0}to{stroke-dashoffset:880}}.boom-report h2{margin-bottom:12px;font-size:1.8rem}.boom-report p{font-size:1rem;line-height:1.4}@keyframes boomFlash{0%{opacity:0;background:rgba(255,255,255,.2)}30%{opacity:1;background:rgba(255,100,0,.6)}60%{background:rgba(255,0,0,.8)}100%{opacity:1;background:rgba(0,0,0,.8)}}@keyframes reportIn{0%{transform:scale(0);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:1}}
        .exit-theme-btn{position:fixed;top:10px;left:10px;z-index:2000;background:rgba(0,0,0,.7);color:#fff;border:2px solid #fff;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.2rem;font-weight:bold;transition:all .2s}.exit-theme-btn:hover{background:rgba(255,255,255,.2);transform:scale(1.1)}
        .leaves-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:-1;overflow:hidden}.leaf{position:absolute;top:-10%;animation:leafFall linear infinite}@keyframes leafFall{to{transform:translateY(110vh) rotate(360deg);opacity:0}}
        .sound-toggle{display:flex;align-items:center;gap:5px;cursor:pointer}footer{margin-top:auto;padding:20px;font-size:.9rem;opacity:.7}
        .modal-content::-webkit-scrollbar{width:8px}.modal-content::-webkit-scrollbar-track{background:rgba(255,255,255,.1);border-radius:4px}.modal-content::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:4px}
        .start-menu-modal .modal-content{max-width:400px;text-align:center}.start-menu-modal .btn{margin:8px auto;width:100%;font-size:1.2rem}
        .stats-card{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:15px;margin-bottom:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .2s}.stats-card:hover{transform:translateY(-2px)}.stats-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:700}.stats-stars{color:#ffd700}.stats-details{display:flex;justify-content:space-between;font-size:.9rem;opacity:.9}.stats-winrate{margin-top:8px;display:flex;align-items:center;gap:8px}.progress-bar{flex:1;height:8px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden}.progress-fill{height:100%;background:#4caf50;border-radius:4px;transition:width .3s ease}.recent-games{margin-top:20px}.recent-games h4{margin-bottom:10px}.recent-game-item{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:rgba(255,255,255,.05);border-radius:8px;margin-bottom:5px;font-size:.9rem}
        .nickname-input{width:100%;padding:12px 18px;border-radius:14px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-size:1.1rem;outline:none;transition:all .3s ease;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);letter-spacing:.5px}.nickname-input:focus{border-color:#ffd700;background:rgba(255,255,255,.2);box-shadow:0 0 20px rgba(255,215,0,.3)}.nickname-input::placeholder{color:rgba(255,255,255,.5)}
        body.pvp-player1{background:linear-gradient(135deg,#ff5555,#cc0000)!important}body.pvp-player2{background:linear-gradient(135deg,#5555ff,#0000cc)!important}.pvp-indicator{font-weight:bold;padding:5px 15px;border-radius:20px;background:rgba(255,255,255,.2)}
        @media(max-width:600px){.logo{font-size:1.3rem}.btn{padding:8px 12px;font-size:.85rem}.game-info{gap:10px;padding:10px 14px;font-size:.95rem}.shop-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}.modal-content{padding:16px}.hint{font-size:.85rem;padding:10px 14px}.boom-report{width:260px;height:260px;padding:20px}.boom-ring circle{stroke-dasharray:754}@keyframes ringCountdown{from{stroke-dashoffset:0}to{stroke-dashoffset:754}}}
    </style>
</head>
<body>
    <!-- ВЕСЬ HTML БЕЗ ИЗМЕНЕНИЙ -->
    <div id="leavesContainer" class="leaves-container" style="display:none;"></div>
    <div class="modal-overlay active start-menu-modal" id="startMenuModal">
        <div class="modal-content">
            <div class="modal-header"><div class="modal-title">INSIK GAME</div><button class="close-btn" data-close>&times;</button></div>
            <button class="btn" id="singlePlayerBtn">Одиночная игра</button>
            <button class="btn" id="multiplayerBtn">Игра друг против друга</button>
            <button class="btn" id="settingsBtn">Настройки</button>
            <button class="btn" id="aboutBtn">О разработчике</button>
            <button class="btn" id="profileMenuBtn">Профиль</button>
        </div>
    </div>
    <div class="modal-overlay" id="pvpModal">
        <div class="modal-content">
            <div class="modal-header"><div class="modal-title">Игра друг против друга</div><button class="close-btn" data-close>&times;</button></div>
            <p>В этом режиме опыт (XP) не накапливается.</p>
            <button class="btn" id="pvpOkBtn">ОК</button>
        </div>
    </div>
    <header class="glass">
        <div class="logo">INSIK GAME</div>
        <div class="header-right">
            <div class="level-info" id="levelInfo" title="Уровень"><span>🏆</span><span id="levelDisplay">1</span><span class="xp" id="xpDisplay">0 XP</span></div>
            <div class="balance" title="Баланс"><span class="coin">🪙</span><span id="balanceAmount">0</span></div>
            <div class="pvp-indicator" id="pvpIndicator" style="display:none;">Ход: Игрок 1</div>
            <div class="sound-toggle" id="soundToggle" title="Звук">🔊</div>
            <button class="btn profile-btn" id="profileBtn"><span class="avatar" id="profileAvatar">😊</span><span id="profileName">Профиль</span></button>
            <button class="btn header-btn" id="menuBtn">Меню</button>
            <button class="btn header-btn" id="instructionBtn">Инструкция</button>
            <button class="btn header-btn" id="shopBtn">Магазин</button>
            <button class="btn header-btn" id="statsBtn">Статистика</button>
            <button class="btn lang-btn" id="langToggle">EN</button>
            <button class="btn cheat-btn" id="cheatBtn" style="display:none;">Чит</button>
        </div>
    </header>
    <div id="exitThemeBtn" class="exit-theme-btn" style="display:none;">✕</div>
    <main>
        <div class="game-info glass">
            <div class="info-item"><span>💣</span><span id="mineCounter">0</span></div>
            <div class="info-item"><span>⏱️</span><span id="timerDisplay">00:00</span></div>
            <div class="info-item">
                <span class="booster-icon" data-booster="safe_cell" id="booster-safe">🛡️ <span class="booster-count">0</span></span>
                <span class="booster-icon" data-booster="freeze_time" id="booster-freeze">❄️ <span class="booster-count">0</span></span>
                <span class="booster-icon" data-booster="hint_zone" id="booster-hint">💡 <span class="booster-count">0</span></span>
            </div>
        </div>
        <div class="board-wrapper glass" id="boardWrapper"><div id="board" class="board"></div></div>
        <div id="konamiProgress" class="konami-progress"></div>
        <div class="hint glass" id="hint"></div>
        <div class="controls">
            <button class="btn" id="difficultyBtn">Сложность</button>
            <button class="btn" id="sizeBtn">Размер поля</button>
            <button class="btn" id="restartBtn">Начать заново</button>
            <button class="btn" id="continueBtn" style="display:none;">Продолжить</button>
        </div>
    </main>
    <footer id="versionFooter">Версия 1.0.0</footer>

    <!-- Все модальные окна -->
    <div class="modal-overlay" id="instructionModal"><div class="modal-content"><div class="modal-header"><div class="modal-title">Как играть</div><button class="close-btn" data-close>&times;</button></div><div class="instruction-text" id="instructionBody"></div></div></div>
    <div class="modal-overlay" id="difficultyModal"><div class="modal-content"><div class="modal-header"><div class="modal-title">Сложность</div><button class="close-btn" data-close>&times;</button></div><div class="difficulty-options" id="difficultyOptions"><button class="difficulty-btn" data-difficulty="1">★</button><button class="difficulty-btn" data-difficulty="2">★★</button><button class="difficulty-btn" data-difficulty="3">★★★</button><button class="difficulty-btn" data-difficulty="4">★★★★</button><button class="difficulty-btn" data-difficulty="5">★★★★★</button></div></div></div>
    <div class="modal-overlay" id="sizeModal"><div class="modal-content"><div class="modal-header"><div class="modal-title">Размер поля</div><button class="close-btn" data-close>&times;</button></div><div class="size-form"><div class="size-inputs"><label><span>Ширина</span><input type="number" id="inputWidth" min="5" max="30" value="9"></label><label><span>Высота</span><input type="number" id="inputHeight" min="5" max="30" value="9"></label></div><div class="error-msg" id="sizeError"></div><button class="btn" id="applySize">Применить</button></div></div></div>
    <div class="modal-overlay" id="shopModal"><div class="modal-content"><div class="modal-header"><div class="modal-title">Магазин</div><button class="close-btn" data-close>&times;</button></div><div class="shop-tabs"><button class="shop-tab active" data-tab="themes">Темы</button><button class="shop-tab" data-tab="skins">Скины мин</button><button class="shop-tab" data-tab="boosters">Бустеры</button></div><div class="shop-grid" id="shopItems"></div></div></div>
    <div class="modal-overlay" id="statsModal"><div class="modal-content"><div class="modal-header"><div class="modal-title">Статистика</div><button class="close-btn" data-close>&times;</button></div><div id="statsContainer"></div></div></div>
    <div class="modal-overlay" id="resultModal"><div class="modal-content"><div class="modal-header"><div class="modal-title" id="resultTitle"></div><button class="close-btn" data-close>&times;</button></div><div id="resultMessage" style="margin-bottom:16px;font-size:1.1rem;"></div><button class="btn" id="resultBtn">Новая игра</button></div></div>

            document.getElementById('settingsSoundToggle').addEventListener('click',()=>{soundEnabled=!soundEnabled;state.sound=soundEnabled;saveState();soundToggle.textContent=soundEnabled?'🔊':'🔇'});
            
            // ========== КОДЫ ==========
            document.addEventListener('keydown',e=>{if(e.key>='0'&&e.key<='9'){keyBuffer.push(e.key);if(keyBuffer.length>6)keyBuffer.shift();const code=keyBuffer.join('');if(code==='211224'){if(cheatBtn.style.display==='none'||cheatBtn.style.display===''){showCheatButton();showToast('Чит-код активирован!','success');keyBuffer=[]}}else if(code==='0907'){if(!state.ownedThemes.includes('yinyang')){state.ownedThemes.push('yinyang');saveState()}state.selectedTheme='yinyang';saveState();applyTheme('yinyang');showToast(t('yinyangUnlocked'),'success');keyBuffer=[]}else if(code==='1010'){if(!state.ownedThemes.includes('matrix')){state.ownedThemes.push('matrix');saveState()}state.selectedTheme='matrix';saveState();applyTheme('matrix');showToast(t('matrixUnlocked'),'success');keyBuffer=[]}else if(code==='2020'){if(!state.ownedThemes.includes('space')){state.ownedThemes.push('space');saveState()}state.selectedTheme='space';saveState();applyTheme('space');showToast(t('spaceUnlocked'),'success');keyBuffer=[]}else if(code==='1234'){if(!state.ownedSkins.includes('golden')){state.ownedSkins.push('golden');saveState()}state.selectedSkin='golden';saveState();showToast(t('goldenUnlocked'),'success');keyBuffer=[]}else if(code==='777'){const now=Date.now();const last=state.lastBonusTimes['777']||0;if(now-last<24*60*60*1000){const remaining=24*60*60*1000-(now-last);const hours=Math.floor(remaining/(60*60*1000));const mins=Math.floor((remaining%(60*60*1000))/(60*1000));showToast(`Код 777 можно использовать через ${hours}ч ${mins}м`,'error');keyBuffer=[];return}state.lastBonusTimes['777']=now;saveState();showToast('Мины показаны на 5 секунд','info');document.querySelectorAll('.cell').forEach(cellEl=>{const r=+cellEl.dataset.r,c=+cellEl.dataset.c;if(board[r]&&board[r][c]&&board[r][c].mine)cellEl.classList.add('show-mine')});setTimeout(()=>document.querySelectorAll('.cell.show-mine').forEach(cellEl=>cellEl.classList.remove('show-mine')),5000);keyBuffer=[]}else if(code==='555'){const now=Date.now();const last=state.lastBonusTimes['555']||0;if(now-last<24*60*60*1000){const remaining=24*60*60*1000-(now-last);const hours=Math.floor(remaining/(60*60*1000));const mins=Math.floor((remaining%(60*60*1000))/(60*1000));showToast(`Код 555 можно использовать через ${hours}ч ${mins}м`,'error');keyBuffer=[];return}state.lastBonusTimes['555']=now;state.balance+=5000;saveState();updateBalance();showToast('+5000 монет','success');keyBuffer=[]}else if(code==='1402'){showHeart();keyBuffer=[]}}else{keyBuffer=[]}handleKonamiKey(e)});
            
            function showHeart(){const heartEl=document.createElement('div');heartEl.style.cssText=`position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:8rem;z-index:4000;pointer-events:none;transition:transform .3s ease;`;heartEl.textContent='💖';document.body.appendChild(heartEl);requestAnimationFrame(()=>{heartEl.style.transform='translate(-50%,-50%) scale(1)'});setTimeout(()=>{heartEl.style.transform='translate(-50%,-50%) scale(0)';setTimeout(()=>heartEl.remove(),300)},1500)}
            versionFooter.addEventListener('click',()=>{versionClicks++;if(versionClicks>=5){showToast('О, привет!','success');versionClicks=0}});
            
            // ========== ЯЗЫК ==========
            function applyLanguage(){document.documentElement.lang=state.lang;document.querySelectorAll('[data-i18n]').forEach(el=>{const key=el.dataset.i18n;if(translations[state.lang][key])el.textContent=translations[state.lang][key]});document.getElementById('langToggle').textContent=state.lang==='ru'?'EN':'RU';updateMineCounter();updateTimer();updateBalance();updateLevel();updateBoosterUI();updateProfileUI();showRandomHint()}
            function showRandomHint(){const list=hints[state.lang];if(list&&list.length){hintEl.textContent=list[Math.floor(Math.random()*list.length)]}}
            function startHintRotation(){if(hintInterval)clearInterval(hintInterval);showRandomHint();hintInterval=setInterval(showRandomHint,12000)}
            
            // ========== ИНИЦИАЛИЗАЦИЯ ==========
            function init(){applyTheme(state.selectedTheme);applyLanguage();initGame();startHintRotation();updateExitThemeButton();updateProfileUI();updateBoosterUI();if(state.sound)soundToggle.textContent='🔊';else soundToggle.textContent='🔇';try{if(localStorage.getItem('insik_current_game'))continueBtn.style.display='inline-block'}catch(e){}startMenuModal.classList.add('active');pvpIndicator.style.display='none'}
            window.addEventListener('resize',setCellSize);
            init();
        })();
    </script>
</body>
</html>
